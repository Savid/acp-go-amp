name: Test

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Build
        run: make build

      - name: Test and coverage gate
        run: make coverage-check

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Check platform compile and refusal paths
        run: make test-cross-compile

      - name: Check module tidiness
        run: make tidy

      - name: Check modernization drift
        run: make modernize-check

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.txt

  # Environment key identity and child environment behavior need a real
  # Windows host; cross-compilation alone cannot prove them.
  portable-runtime:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Windows behavior proof
        shell: bash
        run: .github/scripts/run-windows-behavior-proof.sh

  native-browser:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Native browser canary
        run: make test-integration-native-browser
