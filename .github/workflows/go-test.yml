name: Test

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Build
        run: go build ./...

      - name: Test and coverage gate
        run: .github/scripts/run-privileged-suite.sh coverage-check

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Check platform compile and refusal paths
        run: make test-cross-compile

      - name: Check module tidiness
        run: |
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum

      - name: Check modernization drift
        run: make modernize-check

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.txt

  trusted-supervisor:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Trusted supervisor security suite
        run: .github/scripts/run-privileged-suite.sh test-trusted-supervisor

  # The self-hosted fleet is Unix, so it can compile the !unix process backend
  # but never selects it. Run that backend where it is actually chosen: a
  # Windows host executes internal/amp/process_unsupported.go for real, which is
  # the only evidence that ordinary launch, completion, cancel and close work
  # rather than merely parse.
  portable-runtime:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Windows behavior proof
        shell: bash
        run: .github/scripts/run-windows-behavior-proof.sh

  native-browser:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Native browser containment canary
        run: .github/scripts/with-privileged-lock.sh make test-integration-native-browser
